services:
  devcontainer:
    image: "swift:6.3.3-noble@sha256:56ef1be2c1ca36f4c52440357dc1fcdfdb5e113587134fcadeef57c225c71b54"
    working_dir: ${WORKSPACE_DIR}
    env_file:
      - .env
    environment:
      PATH: /root/.swiftpm/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - ${GIT_REPO}:${GIT_REPO}:rw
      - ${WORKSPACE_DIR}:${WORKSPACE_DIR}:rw
    command: sleep infinity
